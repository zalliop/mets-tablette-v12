        <p class="hint">Astuce iPhone : touchez le micro du clavier pour dicter vos notes.</p></div>
      <div class="card"><h3>Ingrédients (un par ligne)</h3>
        <textarea data-f="i-ings" placeholder="400 g dorade&#10;6 citrons verts&#10;1 oignon rouge&#10;coriandre">${esc(x.ingredients)}</textarea>
        <p class="hint">Les quantités sont facultatives. Écrivez comme ça vient : « 200 g », « 2 œufs », « 1 piment ».</p></div>
      <div class="card"><h3>Passer en cuisine</h3>
        ${r?`<p style="margin-top:0">Cette idée a déjà une fiche technique : <b>${esc(r.name||"Sans nom")}</b>.</p><button class="btn" data-a="idea-open-recipe">Ouvrir la recette</button>`
           :`<p style="margin-top:0">Quand vous avez testé le plat, transformez-le en fiche technique. Les ingrédients notés sont repris : il ne reste qu'à saisir les quantités et les prix.</p><button class="btn" data-a="idea-convert">Transformer en recette</button>`}
      </div>
    </div>`;
  renderGallery(x);
}
function renderGallery(x){
  const g=$("#gallery"); if(!g) return;
  freeUrls();
  g.innerHTML=x.media.length?x.media.map(m=>`<button class="mtile ${m.type}" data-a="media-open" data-m="${m.id}" aria-label="${m.type==="image"?"Voir la photo":"Voir la vidéo"}">${mediaImgHTML(m)}${m.type==="video"?'<span class="play"></span>':""}<span class="miss">Absent de cet appareil</span></button>`).join("")
    :`<div class="plan-empty">Aucune photo ni vidéo pour l'instant.</div>`;
  hydrate(g);
}
async function openMedia(x,mid){
  const m=x.media.find(k=>k.id===mid); if(!m) return;
  let b=null; if(!m.url){ try{ b=await mdb.get(mid); }catch(e){} }
  let inner;
  if(m.url) inner=m.type==="image"?`<img src="${esc(m.url)}" alt="">`:`<video src="${esc(m.url)}" controls playsinline preload="metadata"${m.purl?` poster="${esc(m.purl)}"`:""}></video>`;
  else if(!b) inner=`<p>Ce fichier n'est pas disponible sur cet appareil : il a été ajouté depuis un autre appareil, ou effacé par le navigateur.</p>`;
  else{ viewerUrl=URL.createObjectURL(b); inner=m.type==="image"?`<img src="${viewerUrl}" alt="">`:`<video src="${viewerUrl}" controls playsinline preload="metadata"></video>`; }
  const d=$("#mediaDlg");
  d.innerHTML=`<div class="dlg mview"><h3>${m.type==="image"?"Photo":"Vidéo"}</h3>${inner}<div class="dlg-actions"><button type="button" class="btn danger" data-a="media-del" data-m="${mid}" style="margin-right:auto">Supprimer</button><button type="button" class="btn" data-a="media-close">Fermer</button></div></div>`;
  d.showModal();
}
$("#mediaDlg").addEventListener("close",()=>{ const v=$("#mediaDlg video"); if(v) v.pause(); if(viewerUrl){ URL.revokeObjectURL(viewerUrl); viewerUrl=null; } $("#mediaDlg").innerHTML=""; });

/* --- Partage (AirDrop, Messages, email, Fichiers...) --- */
async function shareIdea(x){
  const where=[x.place,x.country].filter(Boolean).join(", ");
  const text=[x.title||"Idée de recette",where,x.date?dateFr(x.date):"",x.source?"Source : "+x.source:"",x.notes?"\n"+x.notes:"",x.ingredients?"\nIngrédients :\n"+x.ingredients:""].filter(Boolean).join("\n");
  const files=[]; let n=0;
  for(const m of x.media){
    let b=null; try{ b=await mdb.get(m.id); }catch(e){}
    if(!b) continue; n++;
    const ext=m.type==="image"?"jpg":(/mp4/i.test(b.type||m.mime||"")?"mp4":"mov");
    files.push(new File([b],`${slug(x.title||"idee")}-${n}.${ext}`,{type:b.type||(m.type==="image"?"image/jpeg":"video/quicktime")}));
  }
  try{
    if(navigator.canShare&&files.length&&navigator.canShare({files})) await navigator.share({title:x.title||"Idée de recette",text,files});
    else if(navigator.share) await navigator.share({title:x.title||"Idée de recette",text});
    else{ await navigator.clipboard.writeText(text); toast("Notes copiées"); }
  }catch(e){ if(!e||e.name!=="AbortError") toast("Partage impossible sur cet appareil"); }
}

/* --- Transformer une idée en recette --- */
function parseIngLine(raw){
  let l=String(raw).trim().replace(/^[\-\*•·]+\s*/,"");
  let qty=0,unit=null,name=l,known=true;
  const fr={"½":.5,"¼":.25,"¾":.75};
  const m=l.match(/^(\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?|[½¼¾])\s*(.*)$/);
  if(m){
    const n=m[1];
    if(fr[n]!==undefined) qty=fr[n];
    else if(n.includes("/")){ const [a,b]=n.split("/").map(v=>parseFloat(v.replace(",","."))); qty=b?a/b:0; }
    else qty=parseFloat(n.replace(",","."));
    const rest=m[2];
    const u=rest.match(/^(kg|kilos?|g|gr|grammes?|ml|cl|dl|l|litres?|gousses?|bottes?|bunch|pi[eè]ces?|pcs?)(?:\.|\s+|$)\s*(?:de\s+|d['’]\s*)?(.*)$/i);
    if(u){
      const t=u[1].toLowerCase(); name=u[2];
      if(/^(kg|kilo)/.test(t)) unit="kg"; else if(/^(g|gr|gramme)/.test(t)) unit="g";
      else if(t==="ml") unit="ml"; else if(t==="cl") unit="cl"; else if(t==="dl"){ unit="ml"; qty*=100; }
      else if(/^(l|litre)/.test(t)) unit="L"; else unit="pce";
    }else{
      const o=rest.match(/^(cups?|tasses?|verres?|c\.?\s?à\s?(?:s|c|soupe|café)\.?|cuill?[eè]res?(?:\s+à\s+\w+)?|tbsp|tsp|oz|ounces?|lbs?|pounds?|pinc[ée]es?|pinch)(?:\.|\s+|$)\s*(?:de\s+|d['’]\s*|of\s+)?(.*)$/i);
      if(o){ qty=0; name=o[2]; known=false; }
      else{ unit="pce"; name=rest; }
    }
  }
  name=name.replace(/^(de\s+|d['’]\s*|of\s+)/i,"").trim()||l;
  return {name,qty,unit,known};
}
const singular=s=>norm(s).replace(/s$/,"");
function findIngExact(name){ const n=singular(name); return n?state.ingredients.find(i=>singular(i.name)===n)||null:null; }
function convertIdea(x){
  const lines=(x.ingredients||"").split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
  const rl=[]; let created=0;
  lines.forEach(raw=>{
    const p=parseIngLine(raw);
    let i=findIngExact(p.name);
    if(!i){
      const pu=p.unit==="ml"||p.unit==="cl"||p.unit==="L"?"L":p.unit==="pce"?"pce":"kg";
      i={id:uid(),name:p.name.charAt(0).toUpperCase()+p.name.slice(1),price:0,priceUnit:pu,yield:100,supplier:"",allergens:[],todo:true};
      state.ingredients.push(i); created++;
    }
    const dim=dimOfIng(i); let unit=p.unit;
    if(!unit||!UNITS[dim].includes(unit)) unit=DEFAULT_UNIT[dim];
    const q=(p.unit&&UNITS[dim].includes(p.unit))?p.qty:0;
    rl.push({id:uid(),ingId:i.id,qty:q,unit});
  });
  const where=[x.place,x.country].filter(Boolean).join(", ");
  const notes=[`Idée du carnet de voyage${where?" : "+where:""}${x.date?" ("+dateFr(x.date)+")":""}`,x.source?"Source : "+x.source:"",x.notes?"\n"+x.notes:"",x.ingredients?"\nIngrédients notés au départ :\n"+x.ingredients:""].filter(Boolean).join("\n");
  const r={id:uid(),name:x.title||"Nouvelle recette",portions:4,price:0,notes,lines:rl.length?rl:[{id:uid(),ingId:"",qty:0,unit:"g"}]};
  state.recipes.push(r); x.recipeId=r.id; if(x.status==="a-tester") x.status="teste";
  save(); ui.from="idea"; ui.view="recipe"; ui.recipeId=r.id; render();
  toast(created?`Recette créée. ${created} ingrédient${created>1?"s":""} à compléter (prix et allergènes).`:"Recette créée");
}

/* --- Événements du carnet --- */
document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a, x=idea(ui.ideaId);
  if(a==="nb-new"){
    state.notebook=state.notebook||[];
    const n={id:uid(),title:"",country:"",place:"",date:isoDate(new Date()),source:"",status:"a-tester",notes:"",ingredients:"",media:[],recipeId:null,created:Date.now()};
    state.notebook.push(n); save(); ui.view="idea"; ui.ideaId=n.id; render();
    setTimeout(()=>{ const t=document.querySelector('[data-f="i-title"]'); if(t) t.focus(); },60);
  }
  else if(a==="open-idea"){ ui.view="idea"; ui.ideaId=el.dataset.id; render(); }
  else if(a==="nb-back"){ ui.view="notebook"; render(); }
  else if(a==="nb-filter"){ ui.nbFilter=el.dataset.k; viewNotebook(); }
  else if(a==="cam") $("#camIn").click();
  else if(a==="lib") $("#libIn").click();
  else if(a==="media-open"&&x) openMedia(x,el.dataset.m);
  else if(a==="media-close") $("#mediaDlg").close();
  else if(a==="media-del"&&x){
    if(!confirm("Supprimer ce fichier de l'idée ?")) return;
    const m=x.media.find(k=>k.id===el.dataset.m); x.media=x.media.filter(k=>k.id!==el.dataset.m);
    $("#mediaDlg").close(); if(m && !m.url) dropMedia(m); save(); renderGallery(x); toast("Fichier supprimé");
  }
  else if(a==="idea-share"&&x) shareIdea(x);
  else if(a==="idea-del"&&x){
    if(!confirm(`Supprimer l'idée « ${x.title||"sans nom"} » avec ses photos et vidéos ?`)) return;
    x.media.forEach(dropMedia); state.notebook=state.notebook.filter(k=>k.id!==x.id);
    save(); ui.view="notebook"; render(); toast("Idée supprimée");
  }
  else if(a==="idea-convert"&&x) convertIdea(x);
  else if(a==="idea-open-recipe"&&x&&rec(x.recipeId)){ ui.from="idea"; ui.view="recipe"; ui.recipeId=x.recipeId; render(); }
});
document.addEventListener("input", e=>{
  const f=e.target.dataset.f; if(!f||f[0]!=="i"||f[1]!=="-") return;
  const x=idea(ui.ideaId); if(!x) return;
  const map={"i-title":"title","i-country":"country","i-place":"place","i-date":"date","i-source":"source","i-notes":"notes","i-ings":"ingredients"};
  if(map[f]){ x[map[f]]=e.target.value; save(); }
});
document.addEventListener("change", e=>{
  const f=e.target.dataset.f;
  if(f==="i-status"){ const x=idea(ui.ideaId); if(x){ x.status=e.target.value; save(); } }
  if(f==="i-date"){ const x=idea(ui.ideaId); if(x){ x.date=e.target.value; save(); } }
});
["camIn","libIn"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const x=idea(ui.ideaId); const files=e.target.files; if(x&&files&&files.length) addMedia(x,files); e.target.value="";
}));

load();
render();
initUsb();
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
