/* ========= Principes de la cuisine professionnelle =========
   Contenu fixe (cours) : résumé et sommaire cliquables en tête,
   puis une section par principe. */
const PRINC_SECTIONS = [
["marche","Marche en avant",`
<p class="pr-def"><b>Définition :</b> principe d'organisation qui consiste à faire progresser les denrées alimentaires des zones les plus contaminantes vers les zones les plus propres, sans retour en arrière susceptible de provoquer une contamination.</p>
<p>Son objectif est d'éviter les contaminations croisées entre les aliments crus, les aliments cuits, le matériel sale et les produits prêts à être consommés. Il existe deux formes de marche en avant.</p>
<h4>A. La marche en avant dans l'espace</h4>
<p>Les différentes étapes de préparation sont réalisées dans des zones distinctes :</p>
<ol class="pr-flow"><li>Réception des marchandises</li><li>Stockage</li><li>Préparation des produits crus</li><li>Cuisson</li><li>Préparation des produits cuits</li><li>Dressage et envoi</li></ol>
<h4>B. La marche en avant dans le temps</h4>
<p>Lorsque les locaux ne permettent pas de séparer les activités, plusieurs opérations peuvent être réalisées successivement dans une même zone. Il faut alors organiser les opérations pour éviter les contaminations, notamment en nettoyant et en désinfectant les surfaces et le matériel entre les activités.</p>
<p class="pr-ex"><b>Exemple :</b> préparer les légumes, nettoyer et désinfecter le plan de travail, puis réaliser une préparation nécessitant une zone propre.</p>
<p class="pr-key"><b>À retenir :</b> la marche en avant concerne aussi bien la circulation des aliments que celle du personnel, du matériel et des déchets. La réglementation impose que l'agencement des locaux permette de prévenir les contaminations entre les opérations (Eur-Lex).</p>`],
["poste","Installation du poste de travail",`
<p class="pr-def"><b>Définition :</b> l'installation du poste de travail, également appelée mise en place, consiste à préparer son espace de travail, son matériel et ses ingrédients avant de commencer une réalisation culinaire. Elle permet de travailler efficacement, en sécurité et dans le respect des règles d'hygiène.</p>
<h4>1. Préparer son environnement</h4><ul><li>Vérifier la propreté du plan de travail.</li><li>Nettoyer et désinfecter les surfaces si nécessaire.</li><li>Vérifier que le poste est correctement organisé.</li><li>S'assurer que les équipements fonctionnent.</li></ul>
<h4>2. Préparer le matériel</h4><p>Réunir les ustensiles nécessaires : planches à découper, couteaux et ustensiles adaptés, récipients et bacs alimentaires, balance, thermomètre, matériel de cuisson. Le matériel doit être propre et adapté à son utilisation.</p>
<h4>3. Préparer les denrées</h4><p>Sortir uniquement les ingrédients nécessaires à la préparation, et vérifier :</p><ul><li>leur état de conservation ;</li><li>leur date limite de consommation, lorsqu'elle est applicable ;</li><li>leur identification ;</li><li>leur température, lorsque cela est nécessaire.</li></ul><p>Les produits réfrigérés doivent rester au froid aussi longtemps que possible.</p>
<h4>4. Organiser le travail</h4><p>Préparer les ingrédients et organiser les opérations dans un ordre logique.</p>
<p class="pr-ex"><b>Exemple :</b> pour une blanquette de veau, on peut commencer par préparer les légumes, organiser les ingrédients de la garniture, puis préparer les éléments nécessaires à la cuisson.</p>
<h4>5. Maintenir le poste propre</h4><ul><li>Éliminer régulièrement les déchets.</li><li>Nettoyer les ustensiles.</li><li>Séparer les opérations contaminantes des opérations propres.</li><li>Se laver les mains aux moments appropriés.</li></ul>
<h4>6. Ranger et nettoyer le poste</h4><ul><li>Ranger les denrées.</li><li>Identifier les produits conservés.</li><li>Nettoyer et désinfecter le matériel et les surfaces selon le plan de nettoyage.</li><li>Évacuer les déchets.</li></ul>
<p class="pr-key"><b>Objectif :</b> disposer d'un poste fonctionnel, propre et sécurisé, permettant de réaliser les préparations dans de bonnes conditions.</p>`],
["temp","Températures et stockage",`
<p class="pr-def"><b>Définition :</b> la maîtrise des températures consiste à conserver, transporter, préparer et servir les aliments à des températures adaptées afin de limiter le développement des micro-organismes dangereux.</p>
<p>La chaîne du froid doit être respectée pour les denrées qui nécessitent une conservation réfrigérée ou congelée. En France, les températures réglementaires dépendent de la nature des produits. Les températures indiquées par le fabricant doivent également être respectées lorsqu'elles sont applicables (Légifrance).</p>
<h4>A. Les températures de conservation au froid</h4>
<div class="tbl-wrap"><table class="pr-t"><thead><tr><th>Catégorie de denrées</th><th>Température maximale</th></tr></thead><tbody>
<tr><td>Viandes hachées</td><td>+2 °C</td></tr><tr><td>Poissons frais</td><td>+2 °C</td></tr><tr><td>Viandes de volailles</td><td>+4 °C</td></tr><tr><td>Viandes en morceaux</td><td>+4 °C</td></tr><tr><td>Viandes de gros et carcasses entières d'ongulés</td><td>+7 °C</td></tr><tr><td>Abats d'ongulés</td><td>+3 °C</td></tr><tr><td>Préparations culinaires élaborées à l'avance</td><td>+3 °C</td></tr><tr><td>Autres denrées très périssables</td><td>+4 °C</td></tr><tr><td>Autres denrées périssables</td><td>+8 °C</td></tr><tr><td>Glaces et crèmes glacées</td><td>−18 °C</td></tr><tr><td>Autres denrées congelées</td><td>−12 °C</td></tr></tbody></table></div>
<p>Ces valeurs sont issues de l'annexe I de l'arrêté du 21 décembre 2009. Elles correspondent aux températures maximales applicables aux catégories indiquées, et non à une température universelle pour toutes les denrées.</p>
<p class="pr-warn"><b>Attention :</b> les températures de stockage ne sont pas interchangeables. Il faut toujours vérifier la catégorie du produit, les indications du fabricant et les dispositions particulières applicables.</p>
<h4>B. Le stockage des denrées</h4>
<p><b>Dans une chambre froide positive :</b> respecter la température adaptée aux produits ; séparer les produits crus des préparations cuites et prêtes à consommer ; protéger les denrées ; utiliser des contenants propres et adaptés ; identifier les produits entamés et les préparations ; ne pas surcharger les équipements au point d'empêcher la circulation de l'air froid.</p>
<p><b>Dans un congélateur :</b> respecter la température de conservation indiquée ; maintenir les produits congelés ; protéger les denrées contre les contaminations ; identifier les produits et contrôler leur durée de conservation.</p>
<p><b>Dans la réserve sèche :</b> local propre, sec et adapté ; protéger contre l'humidité et les nuisibles ; ne pas poser les denrées directement sur le sol ; séparer les produits alimentaires des produits d'entretien.</p>
<h4>C. Les méthodes FIFO et FEFO</h4>
<div class="pr-two"><div class="pr-box"><b>FIFO — First In, First Out</b><p>Premier entré, premier sorti : le produit reçu en premier est utilisé en premier, lorsque les conditions de conservation et les dates le permettent.</p></div>
<div class="pr-box"><b>FEFO — First Expired, First Out</b><p>Premier périmé, premier sorti : le produit dont la date limite arrive en premier est utilisé en priorité, s'il est encore propre à la consommation.</p></div></div>
<p>En pratique, la méthode FEFO permet de mieux gérer les dates de péremption.</p>
<h4>D. Le contrôle des températures</h4>
<p>Organisé selon le plan de maîtrise sanitaire, il peut comprendre : le contrôle des enceintes frigorifiques, des températures des denrées à réception, de la température des aliments pendant certaines étapes, l'enregistrement des résultats et les actions correctives en cas d'anomalie.</p>
<p class="pr-ex"><b>Exemple :</b> si une chambre froide présente une température anormale, il faut évaluer la situation, vérifier la température des denrées concernées et prendre les mesures adaptées. Il ne suffit pas de régler le thermostat en ignorant les aliments qui ont pu subir une rupture de la chaîne du froid.</p>`],
["reception","Contrôle à la réception",`
<p class="pr-def"><b>Définition :</b> vérifier que les produits livrés correspondent à la commande et qu'ils peuvent être acceptés dans l'établissement dans des conditions sanitaires satisfaisantes. C'est la première étape du contrôle des denrées après leur livraison.</p>
<div class="tbl-wrap"><table class="pr-t"><thead><tr><th>Point de contrôle</th><th>Ce qu'il faut vérifier</th></tr></thead><tbody>
<tr><td>Le fournisseur</td><td>Identité et conformité du fournisseur</td></tr><tr><td>La commande</td><td>Nature et quantité des produits</td></tr><tr><td>L'emballage</td><td>Absence de détérioration ou de fuite</td></tr><tr><td>L'aspect</td><td>Absence d'altération apparente</td></tr><tr><td>La température</td><td>Respect de la température applicable</td></tr><tr><td>Les dates</td><td>DLC ou DDM, selon le produit</td></tr><tr><td>La traçabilité</td><td>Lot, étiquetage et documents disponibles</td></tr><tr><td>La conformité</td><td>Correspondance entre le produit livré et le produit commandé</td></tr></tbody></table></div>
<p class="pr-ex"><b>Exemple :</b> un fournisseur livre des filets de poulet réfrigérés. On vérifie l'état des emballages, la température du produit, la date limite de consommation, l'identification du produit et du lot, et la conformité de la livraison. En cas d'anomalie, on isole le produit et on décide de son acceptation ou de son refus selon les procédures de l'établissement.</p>
<p class="pr-key"><b>À retenir :</b> une marchandise ne doit pas être acceptée uniquement parce qu'elle a été livrée par un fournisseur habituel.</p>`],
["traca","Traçabilité des denrées",`
<p class="pr-def"><b>Définition :</b> la traçabilité est la capacité de retrouver l'origine d'une denrée alimentaire, son parcours et, lorsque cela est nécessaire, sa destination. Elle permet de retrouver les produits concernés lorsqu'un problème sanitaire est identifié (Eur-Lex).</p>
<h4>A. À la réception</h4>
<p>Pour chaque livraison, il faut pouvoir retrouver : le nom du fournisseur, la date de réception, la désignation du produit, la quantité reçue, le numéro de lot (lorsqu'il est applicable), la DLC ou la DDM, les informations de température si le contrôle est nécessaire, le bon de livraison ou la facture. Ces informations sont conservées selon les obligations applicables et les procédures de l'établissement.</p>
<h4>B. Pendant la préparation</h4>
<p>Lorsqu'un produit est ouvert, transformé ou utilisé dans une préparation, il faut pouvoir gérer son identification et sa conservation.</p>
<p class="pr-ex"><b>Exemple :</b> après ouverture d'une brique de crème fraîche, il faut pouvoir identifier le produit et connaître la durée de conservation applicable. Si cette crème sert à une sauce, on respecte aussi les règles de conservation de la sauce obtenue.</p>
<h4>C. En cas de problème sanitaire</h4>
<p>Un fournisseur annonce le rappel d'un lot de fromage. Grâce à la traçabilité, le restaurant doit pouvoir rechercher si ce lot a été réceptionné, s'il est encore en stock, s'il a été utilisé dans une préparation, et quelles mesures prendre.</p>
<p class="pr-key"><b>Objectif :</b> identifier rapidement les produits concernés et empêcher leur utilisation lorsqu'ils présentent un risque.</p>`],
["etiquettes","Étiquetage",`
<p class="pr-def"><b>Définition :</b> l'étiquetage interne consiste à apposer sur un produit ou un contenant une étiquette permettant de l'identifier et de connaître les informations nécessaires à sa conservation et à son utilisation. Il facilite la gestion des stocks, la traçabilité et le respect des règles d'hygiène.</p>
<h4>A. Les informations à inscrire</h4>
<div class="tbl-wrap"><table class="pr-t"><thead><tr><th>Information</th><th>Utilité</th></tr></thead><tbody>
<tr><td>Nom du produit</td><td>Identifier la denrée</td></tr><tr><td>Date d'ouverture</td><td>Savoir quand l'emballage a été ouvert</td></tr><tr><td>Date de fabrication</td><td>Identifier la date de réalisation d'une préparation</td></tr><tr><td>Date limite d'utilisation</td><td>Connaître la limite d'utilisation définie</td></tr><tr><td>Température de conservation</td><td>Connaître les conditions de stockage</td></tr><tr><td>Numéro de lot</td><td>Assurer la traçabilité, lorsqu'il est applicable</td></tr><tr><td>Nom ou initiales du préparateur</td><td>Identifier la personne responsable</td></tr></tbody></table></div>
<p>Toutes ces mentions ne sont pas obligatoires sur chaque étiquette interne : elles dépendent du produit, de son conditionnement et des règles applicables.</p>
<h4>B. Exemple d'étiquette pour une préparation maison</h4>
<div class="pr-label"><div class="pr-label-h">SAUCE BÉCHAMEL</div>
<dl><div><dt>Date de fabrication</dt><dd>26/09/2026</dd></div><div><dt>Heure de fabrication</dt><dd>10 h 30</dd></div><div><dt>Température de conservation</dt><dd>Selon le protocole applicable</dd></div><div><dt>DLC interne</dt><dd>Selon la durée de vie validée</dd></div><div><dt>Responsable</dt><dd>Initiales du préparateur</dd></div></dl></div>
<p>La date limite d'utilisation ne doit pas être choisie arbitrairement : elle dépend de la nature de la préparation, de son procédé de fabrication, de ses conditions de conservation et des règles sanitaires applicables.</p>
<h4>C. DLC et DDM</h4>
<div class="pr-two"><div class="pr-box"><b>DLC — date limite de consommation</b><p>« À consommer jusqu'au… ». Concerne les denrées microbiologiquement très périssables. Après cette date, le produit ne doit normalement plus être consommé.</p></div>
<div class="pr-box"><b>DDM — date de durabilité minimale</b><p>« À consommer de préférence avant… ». Concerne surtout la qualité. Son dépassement ne rend pas automatiquement le produit dangereux, si la conservation a été respectée et l'emballage est intact.</p></div></div>
<p class="pr-warn"><b>Attention :</b> après ouverture, les conditions et la durée de conservation peuvent changer. Il faut respecter les indications du fabricant et les procédures applicables.</p>`],
["cuisson","Cuisson, refroidissement et remise en température",`
<p>Le contrôle des températures ne concerne pas seulement les chambres froides : il s'applique aussi aux étapes de préparation et de service.</p>
<h4>A. La cuisson</h4><p>Elle doit être adaptée au produit. La température à cœur et la durée de cuisson sont des paramètres importants ; la température requise dépend de la nature de l'aliment, de son épaisseur, du procédé de cuisson et des dangers identifiés. Il ne faut pas appliquer une température unique à toutes les préparations.</p>
<h4>B. Le refroidissement rapide</h4><p>Une préparation chaude à conserver au froid doit être refroidie rapidement. En restauration collective, la température à cœur ne doit pas rester entre <b>+63 °C et +10 °C pendant plus de deux heures</b>, sauf dispositif différent justifié par une analyse des dangers validée. Après refroidissement, les préparations sont conservées entre <b>0 °C et +3 °C</b> (Légifrance).</p>
<p class="pr-ex"><b>Exemple :</b> après la cuisson d'un grand volume de sauce, on ne la laisse pas refroidir lentement à température ambiante : on utilise une méthode adaptée, par exemple une cellule de refroidissement rapide.</p>
<h4>C. La remise en température</h4><p>En restauration collective, la préparation ne doit pas rester <b>plus d'une heure entre +10 °C et la température de remise au consommateur</b>, qui ne peut normalement pas être inférieure à <b>+63 °C</b>, sous réserve des dérogations prévues (Légifrance).</p>
<h4>D. Le maintien au chaud</h4><p>En restauration collective, la température de référence est généralement de <b>+63 °C minimum</b>, selon les dispositions applicables.</p>
<p class="pr-key"><b>À distinguer :</b> température de cuisson, de refroidissement, de remise en température et de maintien au chaud : quatre opérations différentes, avec des objectifs distincts.</p>`],
["personnel","Hygiène du personnel",`
<p class="pr-def"><b>Définition :</b> l'ensemble des pratiques qui évitent que les personnes travaillant en cuisine contaminent les aliments.</p>
<h4>La tenue professionnelle</h4><p>Propre et adaptée : veste ou tenue de cuisine, pantalon professionnel, chaussures adaptées, coiffe maîtrisant les cheveux.</p>
<h4>Le lavage des mains est indispensable</h4><ul><li>À la prise de poste.</li><li>Après être allé aux toilettes.</li><li>Après avoir manipulé des déchets.</li><li>Après des aliments crus, avant des aliments prêts à consommer.</li><li>Après s'être mouché.</li><li>Après toute opération susceptible de contaminer les mains.</li></ul>
<h4>Les comportements à éviter</h4><ul><li>Manipuler les aliments avec des mains sales.</li><li>Porter des bijoux susceptibles de contaminer les aliments.</li><li>Manger au-dessus des préparations.</li><li>Tousser ou éternuer au-dessus des denrées.</li><li>Manipuler des aliments lorsque son état de santé présente un risque.</li></ul>
<p class="pr-key"><b>À retenir :</b> le port de gants ne remplace pas le lavage des mains. Les personnes manipulant les aliments doivent recevoir des instructions ou une formation adaptées (Eur-Lex).</p>`],
["nettoyage","Nettoyage et désinfection",`
<div class="pr-two"><div class="pr-box"><b>Nettoyer</b><p>Éliminer les salissures et les résidus présents sur une surface.</p></div><div class="pr-box"><b>Désinfecter</b><p>Réduire les micro-organismes présents sur une surface à un niveau compatible avec la sécurité sanitaire.</p></div></div>
<p>Les deux opérations sont complémentaires.</p>
<h4>Les étapes</h4><ol class="pr-flow"><li>Débarrasser la surface des déchets et des résidus</li><li>Nettoyer avec le produit adapté</li><li>Rincer si nécessaire</li><li>Appliquer le désinfectant si le protocole le prévoit</li><li>Respecter le temps de contact</li><li>Rincer si les instructions l'exigent</li><li>Laisser sécher ou sécher selon la méthode prévue</li></ol>
<h4>Les équipements concernés</h4><p>Plans de travail, planches à découper, couteaux et ustensiles, fourneaux, fours, chambres froides, réfrigérateurs, poignées et surfaces fréquemment touchées, matériel de préparation.</p>
<p class="pr-key"><b>Le PND (plan de nettoyage et de désinfection)</b> précise les zones et équipements, les produits, les méthodes, les fréquences et les responsabilités. Les produits d'entretien sont stockés séparément des denrées (Eur-Lex).</p>`],
["croisees","Contaminations croisées",`
<p class="pr-def"><b>Définition :</b> une contamination croisée se produit lorsqu'un danger est transféré d'un aliment, d'une surface, d'un ustensile ou d'une personne vers un autre aliment. Les dangers peuvent être microbiologiques, chimiques ou physiques.</p>
<div class="tbl-wrap"><table class="pr-t"><thead><tr><th>Situation</th><th>Risque</th></tr></thead><tbody>
<tr><td>Découper du poulet cru puis une salade sur la même planche sans nettoyage adapté</td><td>Microbiologique</td></tr><tr><td>Stocker une viande crue au-dessus d'une préparation prête à consommer</td><td>Par écoulement</td></tr><tr><td>Ranger un produit d'entretien avec les aliments</td><td>Chimique</td></tr><tr><td>Laisser tomber un morceau de plastique dans une préparation</td><td>Physique</td></tr></tbody></table></div>
<h4>Les mesures de prévention</h4><ul><li>Séparer les produits crus et les produits cuits.</li><li>Utiliser du matériel adapté aux différentes opérations.</li><li>Nettoyer et désinfecter les surfaces.</li><li>Se laver les mains.</li><li>Protéger les préparations.</li><li>Ranger correctement les denrées.</li><li>Éviter les contacts entre aliments et déchets.</li></ul>
<p class="pr-key">La prévention des contaminations croisées est l'un des objectifs principaux de la marche en avant.</p>`],
["allergenes","Gestion des allergènes",`
<p class="pr-def"><b>Définition :</b> un allergène alimentaire est une substance susceptible de provoquer une réaction allergique chez une personne sensibilisée. En restauration, les professionnels doivent pouvoir informer les clients de la présence des allergènes réglementés dans les plats.</p>
<h4>Les 14 catégories réglementées</h4>
<ul class="pr-chips"><li>Céréales contenant du gluten</li><li>Crustacés</li><li>Œufs</li><li>Poissons</li><li>Arachides</li><li>Soja</li><li>Lait</li><li>Fruits à coque</li><li>Céleri</li><li>Moutarde</li><li>Graines de sésame</li><li>Sulfites</li><li>Lupin</li><li>Mollusques</li></ul>
<h4>Les bonnes pratiques</h4><ul><li>Connaître les ingrédients de chaque recette.</li><li>Vérifier les étiquettes des produits achetés.</li><li>Tenir à jour les informations sur les allergènes.</li><li>Éviter les contaminations croisées.</li><li>Nettoyer correctement le matériel.</li><li>Informer le client de manière fiable.</li></ul>
<p class="pr-ex"><b>Exemple :</b> une sauce contenant de la crème doit être identifiée comme contenant du lait. Si une recette change, les informations sur les allergènes doivent être vérifiées et mises à jour. Dans Mets, l'onglet Allergènes et chaque fiche recette les calculent à partir des ingrédients.</p>`],
["dechets","Déchets et nuisibles",`
<h4>A. Les déchets</h4><p>Évacués régulièrement pour éviter les contaminations, les mauvaises odeurs, l'attraction des nuisibles et l'encombrement des postes. Les poubelles doivent être adaptées, entretenues et vidées régulièrement. On ne reprend pas une préparation après avoir manipulé des déchets sans se laver les mains.</p>
<h4>B. La lutte contre les nuisibles</h4><p>Insectes et rongeurs peuvent contaminer les denrées et les surfaces. Mesures préventives : nettoyage régulier, protection des denrées, fermeture des ouvertures si nécessaire, contrôle des zones de stockage, surveillance des traces de nuisibles, mesures correctives en cas de présence constatée.</p>
<p class="pr-key">La gestion des nuisibles et des déchets fait partie des éléments examinés lors des contrôles sanitaires (Ministère de l'Agriculture).</p>`],
["haccp","PMS et méthode HACCP",`
<h4>A. Le PMS — Plan de maîtrise sanitaire</h4>
<p class="pr-def"><b>Définition :</b> ensemble de documents et de procédures qui décrit les mesures mises en place par un établissement pour garantir l'hygiène et la sécurité sanitaire des aliments.</p>
<p>Il comprend notamment : les bonnes pratiques d'hygiène, les procédures de nettoyage et de désinfection, la gestion des températures, la traçabilité, la gestion des non-conformités, les procédures fondées sur les principes HACCP, les documents d'enregistrement et d'autocontrôle. Le PMS doit être adapté à l'activité réelle de l'établissement.</p>
<h4>B. La méthode HACCP</h4>
<p><b>Hazard Analysis Critical Control Point</b> : analyse des dangers et maîtrise des points critiques. Elle permet d'identifier les dangers susceptibles de compromettre la sécurité des aliments et de définir les mesures pour les maîtriser. Elle repose sur sept principes :</p>
<ol class="pr-flow"><li>Analyser les dangers</li><li>Déterminer les points critiques pour leur maîtrise</li><li>Fixer les limites critiques</li><li>Mettre en place une surveillance</li><li>Définir les actions correctives</li><li>Vérifier l'efficacité du système</li><li>Constituer les documents et enregistrements</li></ol>
<p>Ces principes sont établis par le règlement européen relatif à l'hygiène des denrées alimentaires (Eur-Lex).</p>`],
["documents","Documents et contrôles",`
<p>Les règles d'hygiène doivent être appliquées, mais il faut aussi pouvoir démontrer qu'elles le sont. Les documents varient selon l'établissement et son plan de maîtrise sanitaire.</p>
<div class="tbl-wrap"><table class="pr-t"><thead><tr><th>Document ou registre</th><th>Fonction</th></tr></thead><tbody>
<tr><td>Fiches de réception</td><td>Enregistrer les contrôles des marchandises</td></tr><tr><td>Relevés de températures</td><td>Suivre les températures des équipements et des denrées</td></tr><tr><td>Étiquettes internes</td><td>Identifier les produits ouverts et les préparations</td></tr><tr><td>Fiches de traçabilité</td><td>Retrouver l'origine et le parcours des denrées</td></tr><tr><td>Plan de nettoyage et de désinfection</td><td>Organiser l'entretien des locaux et du matériel</td></tr><tr><td>Fiches de contrôle du nettoyage</td><td>Enregistrer les opérations réalisées</td></tr><tr><td>Registre des anomalies</td><td>Suivre les non-conformités et les actions correctives</td></tr><tr><td>Documents fournisseurs</td><td>Identifier les fournisseurs et les produits livrés</td></tr><tr><td>Fiches allergènes</td><td>Identifier les allergènes présents dans les préparations</td></tr><tr><td>Documents de formation</td><td>Justifier les formations et instructions du personnel</td></tr></tbody></table></div>
<p>La liste exacte dépend de l'activité, des risques et des obligations de l'établissement. Les contrôles officiels peuvent porter sur les températures, la traçabilité, les allergènes, l'entretien des locaux, la formation et la gestion des déchets.</p>`],
["references","Références réglementaires",`
<ul><li><b>Règlement européen CE n° 852/2004</b> relatif à l'hygiène des denrées alimentaires : hygiène des locaux, bonnes pratiques et principes HACCP.</li>
<li><b>Arrêté du 21 décembre 2009</b> : règles sanitaires et températures de conservation des denrées.</li>

<li><b>Service-Public</b> — Règles d'hygiène dans la restauration : obligations des professionnels.</li></ul>
<p class="pr-key"><b>L'idée essentielle :</b> une cuisine professionnelle doit être organisée de manière à maîtriser les dangers sanitaires à toutes les étapes, de la réception des marchandises jusqu'au service. Marche en avant, mise en place, contrôle des températures, traçabilité, étiquetage et nettoyage sont des moyens complémentaires pour atteindre cet objectif.</p>
<p class="hint">Ce résumé est un support de formation. Les valeurs et obligations évoluent : vérifiez les textes en vigueur et le plan de maîtrise sanitaire de votre établissement.</p>`]
];

function closeDD(except){ document.querySelectorAll(".tab-dd[aria-expanded='true']").forEach(b=>{ if(b!==except){ b.setAttribute("aria-expanded","false"); const m=document.getElementById(b.getAttribute("aria-controls")); if(m) m.hidden=true; } }); }
document.addEventListener("click", e=>{

document.addEventListener("keydown", e=>{

  if(menu && (e.key==="ArrowDown"||e.key==="ArrowUp")){ e.preventDefault(); const it=[...menu.querySelectorAll(".dd-item")]; const i=it.indexOf(document.activeElement); it[(i+(e.key==="ArrowDown"?1:-1)+it.length)%it.length].focus(); }
});
/* ========= Médias : photos et vidéos =========
   Une référence de média : {id, type:"image"|"video", name, size, url?, purl?, poster?, mime?}
   - version tablette : le fichier est dans la base de l'appareil (IndexedDB), on l'affiche via data-mid ;
   - version WordPress : le fichier est envoyé dans la Médiathèque du site (url), partagé par l'équipe. */
const isWP = () => !!(window.METS_WP && window.METS_WP.root);
async function wpUpload(blob, name){
  const W = window.METS_WP, fd = new FormData();
  fd.append("file", blob, name);
  const res = await fetch(W.root + "media", { method:"POST", credentials:"same-origin", headers:{ "X-WP-Nonce": W.nonce }, body: fd });
  let j = null; try{ j = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((j && j.message) || ("Envoi impossible (" + res.status + ")"));
  return j;
}
/* Enregistre un fichier et renvoie sa référence (null si type non pris en charge) */
async function storeMedia(f, opts={}){
  const isImg = (f.type||"").startsWith("image/") || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name||"");
  const isVid = !opts.imagesOnly && ((f.type||"").startsWith("video/") || /\.(mov|mp4|m4v|webm)$/i.test(f.name||""));
  const id = uid();
  if(isImg){
    const b = await shrinkImage(f, opts.max || 1600);
    const name = (f.name||"photo").replace(/\.[^.]+$/,"") + ".jpg";
    if(isWP()){ const j = await wpUpload(b, name); return {id, type:"image", name, size:b.size, url:j.url, wpId:j.id}; }
    await mdb.put(id, b); return {id, type:"image", name, size:b.size};
  }
  if(isVid){
    if(f.size > MAX_VIDEO) throw Object.assign(new Error("trop lourde"), {tooBig:true});
    const poster = await videoPoster(f);
    if(isWP()){
      const j = await wpUpload(f, f.name || "video.mp4");
      let purl = null; if(poster){ try{ purl = (await wpUpload(poster, "apercu.jpg")).url; }catch(e){} }
      return {id, type:"video", name:f.name||"video.mp4", size:f.size, url:j.url, purl, wpId:j.id, mime:f.type||""};
    }
    await mdb.put(id, f); let pid = null; if(poster){ pid = id+"p"; await mdb.put(pid, poster); }
    return {id, type:"video", name:f.name||"video.mov", size:f.size+(poster?poster.size:0), poster:pid, mime:f.type||""};
  }
  return null;
}
/* <img> pour une référence (locale ou en ligne) */
function mediaImgHTML(m, cls="", alt=""){
  if(!m) return "";
  const src = m.type==="video" ? (m.purl || "") : (m.url || "");
  if(src) return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}" loading="lazy">`;
  const mid = m.type==="video" ? m.poster : m.id;
  return mid ? `<img class="${cls}" data-mid="${esc(mid)}" alt="${esc(alt)}">` : "";
}
/* Blob d'une image (pour le PDF) */
async function mediaBlob(m){
  if(!m) return null;
  if(m.url){ try{ const r = await fetch(m.url, {credentials:"same-origin"}); return r.ok ? await r.blob() : null; }catch(e){ return null; } }
  try{ return await mdb.get(m.id); }catch(e){ return null; }
}
/* JPEG prêt pour le PDF : chaîne binaire + dimensions */
async function jpegForPdf(m, max=900){
  const b = await mediaBlob(m); if(!b) return null;
  const url = URL.createObjectURL(b);
  try{
    const im = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth*k), h = Math.round(im.naturalHeight*k);
    const c = document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
    const bin = atob(c.toDataURL("image/jpeg",0.85).split(",")[1]);
    return {data:bin, w, h};
  }catch(e){ return null; } finally { URL.revokeObjectURL(url); }
}

/* ========= Images et vidéos des articles d'histoire =========
   Dans le texte : une ligne « [image:ID] légende » affiche une image de l'article ;
   une ligne qui ne contient qu'un lien YouTube ou Vimeo affiche la vidéo. */
function videoEmbed(url){
  const u = String(url||"").trim(); let m;
  if((m = u.match(/^(?:https?:\/\/)?(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/))) return "https://www.youtube-nocookie.com/embed/"+m[1];
  if((m = u.match(/^(?:https?:\/\/)?(?:www\.|player\.)?vimeo\.com\/(?:video\/)?(\d{6,12})/))) return "https://player.vimeo.com/video/"+m[1];
  return null;
}
function histMediaBlock(p, a){
  let m = p.match(/^\[image:([A-Za-z0-9]+)\]\s*(.*)$/);
  if(m){ const im = (a && a.media || []).find(x=>x.id===m[1]); if(!im) return `<p class="hint">Image introuvable.</p>`;
    return `<figure class="hist-fig">${mediaImgHTML(im,"",m[2]||"")}${m[2]?`<figcaption>${esc(m[2])}</figcaption>`:""}</figure>`; }
  const v = /^\S+$/.test(p) ? videoEmbed(p) : null;
  if(v) return `<div class="hist-video"><iframe src="${esc(v)}" title="Vidéo" loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  return null;
}
function insertAtCursor(ta, text){
  const s = ta.selectionStart ?? ta.value.length, e = ta.selectionEnd ?? s;
  const before = ta.value.slice(0,s), after = ta.value.slice(e);
  const pre = before && !before.endsWith("\n\n") ? (before.endsWith("\n") ? "\n" : "\n\n") : "";
  const post = after && !after.startsWith("\n") ? "\n\n" : "";
  ta.value = before + pre + text + post + after; const pos = (before+pre+text).length; ta.focus(); ta.setSelectionRange(pos,pos);
}

const pickFile = (accept, multiple) => new Promise(res=>{
  const i = document.createElement("input"); i.type="file"; i.accept=accept; if(multiple) i.multiple=true;
  i.onchange = () => res(i.files && i.files.length ? i.files : null); i.click();
});

    }catch(err){ toast(err.message||"Image impossible à ajouter"); }

    if(!videoEmbed(url)) return toast("Lien non reconnu : utilisez un lien YouTube ou Vimeo");
    insertAtCursor(f.elements.body, url.trim()); toast("Vidéo insérée");
  }
  else if(a==="hm-cover-del"){ const d=histDraft(); d.cover=null; renderHistFormMedia(); }
});

function refreshCalc(){
  const r = rec(ui.recipeId); if(!r) return;
  const tgt = r.portions;
  const c = calc(r,tgt);
  const cls = fcClass(c.fc);
  r.lines.forEach(l=>{
    const sc = document.querySelector(`[data-sc="${l.id}"]`);
    const co = document.querySelector(`[data-co="${l.id}"]`);
    if(sc) sc.textContent = (l.unit==="PM" ? "PM" : l.qty>0 ? qtyFmt(l.qty*c.factor,l.unit) : "–");
    const info = lineCostInfo(l);
    if(co && l.unit==="PM"){ co.textContent = "–"; co.title = "Pour mémoire : pas de coût"; }
    else if(co){ co.textContent = lineIng(l) && l.qty>0 ? (info.ok ? money(info.cost*c.factor) : "?") : "–"; co.title = info.ok ? "" : "Conversion impossible"; }
    const eq = document.querySelector(`[data-eq="${l.id}"]`);
    if(eq && l.recId){ const sr=rec(l.recId); eq.innerHTML = sr ? `Recette de base${sr.yieldQty>0?` · produit ${esc(qtyFmt(sr.yieldQty,sr.yieldUnit))}`:""} · <button type="button" class="linkbtn sublink" data-a="open-sub" data-id="${sr.id}">Ouvrir « ${esc(sr.name)} » ›</button>${!info.ok?` · <b class="bad-t">indiquez dans « ${esc(sr.name)} » ce que la recette produit pour utiliser cette unité</b>`:""}` : "Recette supprimée"; eq.classList.remove("bad"); }
    else if(eq){ const i=ing(l.ingId); eq.textContent = !info.ok ? `Conversion impossible : indiquez ${unitDim(l.unit)==="pce"?"le poids d'une pièce":"la densité"} de « ${i.name} » (Ingrédients › Modifier).` : equivText(l.qty,l.unit,i); eq.classList.toggle("bad",!info.ok); }
  });
  const hN = $("#hN"); if(hN) hN.textContent = nf(c.n,c.n%1?1:0);
  const st = $("#scaleTxt");
  if(st) st.innerHTML = c.factor===1 ? "Quantités de la recette de base." : `Quantités multipliées par <b>${nf(c.factor,2).replace(/,00$/,"")}</b>. La recette de base n'est pas modifiée.`;
  const al = recipeAllergens(r);
  const ac = $("#allergChips");
  const todoIngs=r.lines.map(l=>lineIng(l)).filter(i=>i&&i.todo);
  if(ac) ac.innerHTML = (al.length ? al.map(a=>`<span class="chip">${esc(a.s)}</span>`).join("") : (todoIngs.length?"":`<span class="chip none">Aucun allergène déclaré</span>`))
    + (todoIngs.length?`<span class="chip warnchip">À vérifier : allergènes non confirmés pour ${esc(todoIngs.map(i=>i.name).join(", "))}</span>`:"");

  const t = $("#results");
  const tf=state.settings.targetFC, MAXG=Math.max(60,tf*1.6);
  const gp=c.fc===null?0:Math.min(c.fc,MAXG)/MAXG*100, gm=tf/MAXG*100;
  const nopr=r.lines.filter(l=>{ const i=ing(l.ingId); return i&&!i.from&&!(i.price>0); }).length;
  const noconv=r.lines.filter(l=>!lineCostInfo(l).ok).length;
  const row=(k,v)=>`<div class="kv"><span>${k}</span><i></i><b>${v}</b></div>`;
  const ys = r.scaleMode==="yield" ? yieldStats(r,c) : null;
  if(t && r.scaleMode==="yield"){
    const ycls = fcClass(ys ? ys.fc : null), yg = ys&&ys.fc!==null ? Math.min(ys.fc,MAXG)/MAXG*100 : 0;
    t.innerHTML = `
    <div class="t-title">Coût de revient</div>
    ${ys ? `<div class="big ${ycls}">${money(ys.cpu)}</div><div class="cap">par ${ys.unit}${ys.fc!==null?` · food cost ${nf(ys.fc,1)} %`:""}</div>
      ${ys.fc!==null?`<div class="gauge" role="img" aria-label="Food cost comparé à l'objectif"><span class="fill ${ycls}" style="width:${yg.toFixed(1)}%"></span><span class="mark" style="left:${gm.toFixed(1)}%"></span></div>`:""}
      ${row(`Coût par ${ys.unit}`,money(ys.cpu))}
      ${row(`Coût total (${esc(qtyFmt(r.yieldQty,r.yieldUnit))})`,money(c.total))}
      ${r.priceYield>0?row(`Prix de vente par ${ys.unit}`,money(r.priceYield))+row(`Marge par ${ys.unit}`,money(ys.margin))+row("Coefficient","× "+nf(ys.coef,2)):""}
      ${row(`Prix conseillé par ${ys.unit}`,ys.advised===null?"–":money(ys.advised))}`
      : `<div class="big none">–</div><p class="warnline">Indiquez la quantité produite (ex. 1 L) pour obtenir le coût au ${yUnitLabel(r.yieldUnit||"L")}.</p>`}
    ${nopr?`<p class="warnline">${nopr} ingrédient${nopr>1?"s":""} sans prix : le coût est incomplet.</p>`:""}
    ${noconv?`<p class="warnline">${noconv} ligne${noconv>1?"s":""} sans conversion possible : le coût est incomplet.</p>`:""}
    <p class="hint">Le coût tient compte du rendement de chaque ingrédient. Changez la quantité à produire (1 L, 2 L…) : toutes les quantités suivent.</p>`;
  } else if(t) t.innerHTML = `
    <div class="t-title">Coût de revient</div>
    <div class="big ${cls}">${c.fc===null?"–":nf(c.fc,1)+"<small>%</small>"}</div>
    <div class="cap">de food cost · objectif ${tf} %</div>
    <div class="gauge" role="img" aria-label="Food cost comparé à l'objectif"><span class="fill ${cls}" style="width:${gp.toFixed(1)}%"></span><span class="mark" style="left:${gm.toFixed(1)}%"></span></div>
    ${row("Coût par portion",money(c.perPortion))}
    ${row("Coût total ("+nf(c.n,c.n%1?1:0)+" port.)",money(c.total))}
    ${row("Prix de vente",r.price>0?money(r.price):"–")}
    ${row("Marge par portion",c.margin===null?"–":money(c.margin))}
    ${row("Coefficient",c.coef===null?"–":"× "+nf(c.coef,2))}
    ${row("Prix conseillé",c.advised===null?"–":money(c.advised))}
    ${nopr?`<p class="warnline">${nopr} ingrédient${nopr>1?"s":""} sans prix : le coût est incomplet.</p>`:""}
    ${noconv?`<p class="warnline">${noconv} ligne${noconv>1?"s":""} sans conversion possible : le coût est incomplet.</p>`:""}
    <p class="hint">Le prix conseillé donne exactement ${tf} % de food cost. Le coût tient compte du rendement de chaque ingrédient (pertes à l'épluchage, au parage…).</p>`;
  refreshWorkplan();
}

/* --- Étapes de préparation (éditeur) --- */
function stepHTML(r,s,k){
  const anc = null;
  const others = (r.steps||[]).filter(x=>x.id!==s.id);
  const lines = r.lines.filter(l=>lineIng(l));
  const n = new Map((r.steps||[]).map((x,j)=>[x.id,j+1]));
  const top = `<div class="step-top"><button type="button" class="step-fold" data-a="s-fold" data-s="${s.id}" aria-expanded="${!s.c}" aria-label="${s.c?"Déplier":"Replier"} l'étape ${k+1}"><span class="chev" aria-hidden="true"></span><span class="step-n">Étape ${k+1}</span></button>
      <button class="iconbtn no-print" data-a="del-step" data-s="${s.id}" aria-label="Supprimer l'étape ${k+1}">✕</button></div>`;
  if(s.c){
    const meta = stepMeta(r,s);
    return `<div class="step is-folded" data-step="${s.id}">${top}
      <p class="step-text">${(s.text||"").trim()?esc(s.text):"<i>Sans description</i>"}</p>
      ${meta?`<p class="step-meta">${esc(meta)}</p>`:""}</div>`;
  }
  return `<div class="step" data-step="${s.id}">
    ${top}
    <textarea data-f="s-text" data-s="${s.id}" rows="2" placeholder="Ex : Suer les oignons, mouiller au fond, cuire à couvert…">${esc(s.text||"")}</textarea>
    <div class="two">
      ${durHTML(s,"active","Travail")}
      ${durHTML(s,"wait","Cuisson ou repos")}
    </div>
    ${others.length?`<div class="step-sub">À faire après l'étape</div><div class="tgs">${others.map(o=>{
      const on=(s.after||[]).includes(o.id), blocked=!on && ancestors(r,o.id).has(s.id);
      return `<button type="button" class="tg" data-a="s-after" data-s="${s.id}" data-t="${o.id}" aria-pressed="${on}"${blocked?` disabled title="L'étape ${n.get(o.id)} dépend déjà de celle-ci"`:""}>${n.get(o.id)}</button>`;}).join("")}</div>`:""}
    ${lines.length?`<div class="step-sub">Ingrédients utilisés</div><div class="tgs">${lines.map(l=>
      `<button type="button" class="tg" data-a="s-line" data-s="${s.id}" data-l="${l.id}" aria-pressed="${(s.lines||[]).includes(l.id)}">${esc(lineIng(l).name)}</button>`).join("")}</div>`:""}
    <div class="step-sub">Ustensiles</div>
    <div class="tgs">${(s.tools||[]).map((t,j)=>`<span class="tool">${esc(t)}<button type="button" data-a="s-tool-del" data-s="${s.id}" data-j="${j}" aria-label="Retirer ${esc(t)}">✕</button></span>`).join("")}
      <input type="text" class="tool-in" data-f="s-tool" data-s="${s.id}" list="toolList" placeholder="Ajouter (Entrée)" aria-label="Ajouter un ustensile"></div>
  </div>`;
}
function stepsEditorHTML(r){
  return ((r.steps||[]).length>1?`<div class="steps-tools no-print"><button class="btn small ghost" data-a="steps-fold" data-v="close">Tout replier</button><button class="btn small ghost" data-a="steps-fold" data-v="open">Tout déplier</button></div>`:"")
    + (r.steps||[]).map((s,k)=>stepHTML(r,s,k)).join("")
    || `<p class="hint" style="margin:0 0 4px">Découpez la recette en étapes. Indiquez pour chacune le temps de travail et le temps de cuisson ou de repos : l'ordre de travail se calcule tout seul.</p>`;
}
function refreshSteps(){
  const r = rec(ui.recipeId); if(!r) return;
  const el = $("#stepsList"); if(el) el.innerHTML = stepsEditorHTML(r);
  refreshWorkplan();
}

/* --- Ordre de travail (calculé) --- */
function refreshWorkplan(){
  refreshFoldSummaries();
  const r = rec(ui.recipeId); const box = $("#workplan"); if(!r || !box) return;
  const sch = schedule(r);
  if(!sch){ box.innerHTML = `<p class="hint" style="margin:0">Ajoutez des étapes pour obtenir l'ordre de travail, la mise en place et la liste du matériel.</p>`; return; }
  const c = calc(r, r.portions);
  const mep = miseEnPlace(r, sch);
  const tools = recipeTools(r, sch);
  const unset = (r.steps||[]).filter(s=>!(stepDur(s)>0)).length;
  const par = id => { const st=sch.start.get(id); return sch.order.some(o=>o!==id && sch.start.get(o)<st && (sch.start.get(o)+(sch.byId.get(o).active||0))<=st && sch.finish.get(o)>st); };
  box.innerHTML = `
    <div class="wp-sum">
      <div><span>Durée totale</span><b>${fmtMin(sch.total)}</b></div>
      <div><span>Dont travail</span><b>${fmtMin(sch.work)}</b></div>
      <label class="f wp-serv">Heure du service<input type="time" data-f="r-service" value="${esc(r.service||"")}"></label>
    </div>
    ${unset?`<p class="warnline">${unset} étape${unset>1?"s":""} sans durée : indiquez le temps pour un ordre fiable.</p>`:""}
    <ol class="wp">${sch.order.map(id=>{ const s=sch.byId.get(id); return `<li>
      <span class="wp-t">${timeLabel(r,sch,sch.start.get(id))}</span>
      <div><b>Étape ${sch.num.get(id)}</b> ${esc((s.text||"").split("\n")[0].slice(0,110))||"<i>sans description</i>"}
      <div class="wp-d">${s.active?`travail ${fmtMin(s.active)}`:""}${s.active&&s.wait?" · ":""}${s.wait?`cuisson / repos ${fmtMin(s.wait)}`:""}${par(id)?` · <em>pendant une cuisson</em>`:""}</div></div></li>`; }).join("")}
      <li><span class="wp-t">${timeLabel(r,sch,sch.total)}</span><div><b>Service</b></div></li></ol>
    <p class="hint">Les cuissons et repos les plus longs sont lancés en premier ; pendant qu'ils cuisent, les autres étapes se font en parallèle. Une étape attend toujours celles dont elle dépend. Les temps ne changent pas avec le nombre de portions : vérifiez-les pour les grosses quantités.</p>
    <h4>Mise en place, dans l'ordre d'utilisation</h4>
    <ol class="mep">${mep.used.map(l=>`<li><span>${esc(lineIng(l).name)}</span><b>${(l.unit==="PM"?"PM":l.qty>0?qtyFmt(l.qty,l.unit):"–")}</b><i>étape ${sch.num.get(mep.firstUse.get(l.id))}</i></li>`).join("")}</ol>
    ${mep.rest.length?`<p class="hint">Non rattachés à une étape : ${esc(mep.rest.map(l=>lineIng(l).name).join(", "))}.</p>`:""}
    <h4>Matériel</h4>
    ${tools.length?`<div class="chips">${tools.map(t=>`<span class="chip tool-chip">${esc(t)}</span>`).join("")}</div>`:`<p class="hint" style="margin:0">Aucun ustensile indiqué dans les étapes.</p>`}`;
}

function frDate(iso){ const m=/^(\d{4})-(\d{2})(?:-(\d{2}))?$/.exec(iso||""); return m ? (m[3]?m[3]+"/":"")+m[2]+"/"+m[1] : ""; }
function priceBadge(i){
  if(i.from) return "";
  if(i.priceKind==="releve") return `<b class="src-ok">Cours relevé le ${frDate(i.priceDate)}</b> (${esc((i.priceSource||"").split(",").slice(0,2).join(","))}) · `;
  if(i.estimate) return `<b>Prix estimé${i.priceDate?" le "+frDate(i.priceDate):""}, à vérifier</b> · `;
  if(i.priceDate||i.priceSource) return `Prix du ${frDate(i.priceDate)||"?"}${i.priceSource?" ("+esc(i.priceSource)+")":""} · `;
  return "";
}
function baseNotice(){
  const n = baseMissing().length;
  if(!n || state.settings.baseHidden) return "";
  return `<div class="notice no-print"><span><b>Catalogue : ${n} ingrédient${n>1?"s":""} à ajouter</b> (légumes, fruits, viandes, volailles, poissons, fruits de mer, laitiers, céréales, épicerie, épices…), avec rendement, allergènes, conversions et un prix HT daté avec sa source. Vos ingrédients existants ne sont pas modifiés.</span><button class="btn small" data-a="add-base">Ajouter le catalogue</button><button class="btn small ghost" data-a="hide-base">Masquer</button></div>`;
}
function renderIngList(){

  const list = !q ? sorted : [...sorted.filter(i=>normName(i.name).startsWith(q)), ...sorted.filter(i=>{ const n=normName(i.name); return !n.startsWith(q) && n.includes(q); })];
  const {page, items, from, to} = pageSlice("ing", list);

      <div class="money">${i.from?(parentOf(i)?(()=>{ const cpg=costPerGram(i); return cpg!==null&&i.pieceG?money(cpg*i.pieceG)+" la pièce":"d'après "+esc(parentOf(i).name); })():'<span class="badge warn">Origine supprimée</span>'):i.price>0?money(i.price)+" "+PRICE_LABEL[i.priceUnit]:'<span class="badge warn">Prix à saisir</span>'}</div>
      <button class="btn small ghost" data-a="edit-ing" data-id="${i.id}">Modifier</button></div>`;

document.addEventListener("click", e=>{
  const el = e.target.closest("[data-a]"); if(!el) return;
  const a = el.dataset.a;
  const r = rec(ui.recipeId);
  switch(a){
    case "nav": ui.view=el.dataset.v; ui.recipeId=null; ui.from=null; ui.q=""; render(); break;
    case "open-recipe": ui.view="recipe"; ui.recipeId=el.dataset.id; ui.from=null; ui.recStack=[]; render(); break;
    case "back": { if(ui.recStack && ui.recStack.length){ const prev=ui.recStack.pop(); if(rec(prev)){ ui.recipeId=prev; ui.view="recipe"; render(); window.scrollTo(0,0); break; } }
      const fr=ui.from; ui.from=null; ui.view=fr==="plan"?"plan":fr==="idea"?"idea":"recipes"; render(); break; }
    case "new-recipe": {
      const n={id:uid(),name:"",portions:4,price:0,notes:"",lines:[{id:uid(),ingId:"",qty:0,unit:"g"}]};
      state.recipes.push(n); save(); ui.view="recipe"; ui.recipeId=n.id; render();
      setTimeout(()=>document.querySelector('[data-f="r-name"]')?.focus(),50); break; }
    case "dup-recipe": {
      const c=JSON.parse(JSON.stringify(r)); c.id=uid(); c.name=(r.name||"Recette")+" (copie)";
      const lm={}, sm={}; c.lines.forEach(l=>{ const n=uid(); lm[l.id]=n; l.id=n; });
      (c.steps||[]).forEach(st=>{ const n=uid(); sm[st.id]=n; st.id=n; });
      (c.steps||[]).forEach(st=>{ st.after=(st.after||[]).map(x=>sm[x]).filter(Boolean); st.lines=(st.lines||[]).map(x=>lm[x]).filter(Boolean); }); state.recipes.push(c); save(); ui.recipeId=c.id; render(); toast("Recette dupliquée"); break; }
    case "del-recipe":
      { const users=usedIn(r.id);
      if(confirm(`Supprimer la recette « ${r.name||"Sans nom"} » ?`+(users.length?`\n\nAttention : elle est utilisée dans ${users.map(x=>"« "+x.name+" »").join(", ")}. Elle sera retirée de ces recettes.`:""))){
        users.forEach(x=>{ const gone=x.lines.filter(l=>l.recId===r.id).map(l=>l.id); x.lines=x.lines.filter(l=>l.recId!==r.id); (x.steps||[]).forEach(st=>st.lines=(st.lines||[]).filter(id=>!gone.includes(id))); });
        state.recipes=state.recipes.filter(x=>x.id!==r.id); save(); ui.view="recipes"; render(); toast("Recette supprimée"); } }
      break;
    case "add-line": {
      r.lines.push({id:uid(),ingId:"",qty:0,unit:"g"}); save(); viewRecipe();
      const s=document.querySelectorAll(".pick-in"); s[s.length-1]?.focus(); break; }
    case "del-line": r.lines=r.lines.filter(l=>l.id!==el.dataset.l); (r.steps||[]).forEach(st=>st.lines=(st.lines||[]).filter(x=>x!==el.dataset.l)); save(); viewRecipe(); break;
    case "add-step": { r.steps=r.steps||[]; r.steps.forEach(x=>{ if((x.text||"").trim()) x.c=true; }); const st={id:uid(),text:"",active:0,wait:0,after:r.steps.length?[r.steps[r.steps.length-1].id]:[],lines:[],tools:[]}; r.steps.push(st); save(); refreshSteps();
      setTimeout(()=>document.querySelector(`[data-f="s-text"][data-s="${st.id}"]`)?.focus(),30); break; }
    case "del-step": { const sid=el.dataset.s; const st=(r.steps||[]).find(x=>x.id===sid);
      if(st && (st.text||"").trim() && !confirm("Supprimer cette étape ?")) break;
      r.steps=r.steps.filter(x=>x.id!==sid); r.steps.forEach(x=>{ if((x.after||[]).includes(sid)) x.after=[...new Set([...(x.after||[]).filter(y=>y!==sid),...(st.after||[])])]; }); save(); refreshSteps(); break; }
    case "s-after": { const st=r.steps.find(x=>x.id===el.dataset.s), t=el.dataset.t; st.after=st.after||[];
      if(st.after.includes(t)) st.after=st.after.filter(x=>x!==t); else if(!ancestors(r,t).has(st.id)) st.after.push(t);
      save(); refreshSteps(); break; }
    case "s-line": { const st=r.steps.find(x=>x.id===el.dataset.s), l=el.dataset.l; st.lines=st.lines||[];
      st.lines = st.lines.includes(l) ? st.lines.filter(x=>x!==l) : [...st.lines,l];
      el.setAttribute("aria-pressed", String(st.lines.includes(l))); save(); refreshWorkplan(); break; }
    case "s-tool-del": { const st=r.steps.find(x=>x.id===el.dataset.s); st.tools.splice(Number(el.dataset.j),1); save(); refreshSteps(); break; }
    case "scale-reset": delete ui.target[r.id]; viewRecipe(); break;
    case "print": window.print(); break;
    case "clear-sample": {
      const n = removeSamples(true);
      if(n===null) break;
      save(); render(); toast(n?"Exemples supprimés. Vos données sont conservées.":"Aucun exemple à supprimer."); break; }
    case "hide-sample": state.sample=false; save(); render(); toast("Message masqué"); break;
    case "add-base": { const n=addBaseList(); save(); render(); toast(n?`${n} ingrédient${n>1?"s":""} ajouté${n>1?"s":""}. Vérifiez les prix avec vos fournisseurs.`:"Tous les ingrédients de la liste sont déjà présents."); } break;
    case "hide-base": state.settings.baseHidden=true; save(); render(); break;
    case "new-ing": openIng(null); break;
    case "new-ing-inline": openIng(null, id=>{ const rr=rec(ui.recipeId); if(rr){ const empty=rr.lines.find(l=>!l.ingId&&!l.recId); const i=ing(id); if(empty&&i){empty.ingId=id;empty.unit=defaultUnit(i);} else if(i){rr.lines.push({id:uid(),ingId:id,qty:0,unit:defaultUnit(i)});} save(); viewRecipe(); } }); break;
    case "edit-ing": openIng(el.dataset.id); break;
    case "close-dlg": $("#ingDlg").close(); break;
    case "del-ing": {
      const id=el.dataset.id; const used=state.recipes.filter(x=>x.lines.some(l=>l.ingId===id));
      const msg = used.length ? `Cet ingrédient est utilisé dans : ${used.map(x=>x.name||"Sans nom").join(", ")}. Le supprimer laissera une ligne vide dans ces recettes. Continuer ?` : "Supprimer cet ingrédient ?";
      if(confirm(msg)){
        state.ingredients=state.ingredients.filter(i=>i.id!==id);
        state.recipes.forEach(x=>x.lines.forEach(l=>{ if(l.ingId===id) l.ingId=""; }));
        save(); $("#ingDlg").close(); render(); toast("Ingrédient supprimé"); }
      break; }
    case "export": backupNow(); break;
    case "import": $("#fileIn").click(); break;
    case "reset":
      if(confirm("Tout effacer ? Pensez à faire une sauvegarde avant.") && confirm("Dernière confirmation : effacer toutes les données ?")){
        state=emptyData(); save(); render(); toast("Données effacées"); }
      break;
  }
});

/* Supprime UNIQUEMENT les exemples, jamais les données de l'utilisateur.
   Les ingrédients d'exemple ne sont retirés que s'ils ne servent plus. */
const SAMPLE_RECIPES = ["Gratin dauphinois","Pâte sablée"];
const SAMPLE_INGS = ["Farine T55","Beurre","Œufs","Sucre","Lait entier","Crème liquide","Pommes de terre","Sel fin"];
function removeSamples(ask){
  const recs = state.recipes.filter(r=>SAMPLE_RECIPES.includes(r.name));
  if(ask && !confirm(recs.length
      ? `Supprimer ${recs.map(r=>"« "+r.name+" »").join(" et ")} ? Vos autres recettes et vos ingrédients utilisés sont conservés.`
      : "Aucune recette d'exemple trouvée. Masquer simplement le message ?")) return null;
  const gone = new Set(recs.map(r=>r.id));
  state.recipes = state.recipes.filter(r=>!gone.has(r.id));
  Object.keys(state.plan||{}).forEach(d=>{ state.plan[d]=state.plan[d].filter(p=>!gone.has(p.recipeId)); if(!state.plan[d].length) delete state.plan[d]; });
  const used = new Set(state.recipes.flatMap(r=>r.lines.map(l=>l.ingId)));
  const parents = new Set(state.ingredients.map(i=>i.from).filter(Boolean));
  state.ingredients = state.ingredients.filter(i=>!(SAMPLE_INGS.includes(i.name) && !i.base && !used.has(i.id) && !parents.has(i.id)));
  state.notebook = (state.notebook||[]).filter(x=>!(x.title==="Ceviche de dorade" && !x.recipeId && !(x.media||[]).length));
  state.sample = false;
  return recs.length;
}

/* Ajoute un ustensile à une étape (Entrée ou choix dans la liste) */
function addTool(r, sid, value){
  const st=(r.steps||[]).find(x=>x.id===sid); const v=String(value||"").trim(); if(!st||!v) return;
  st.tools=st.tools||[];
  if(!st.tools.some(t=>normName(t)===normName(v))) st.tools.push(v.charAt(0).toUpperCase()+v.slice(1));
  save(); refreshSteps();
  setTimeout(()=>document.querySelector(`[data-f="s-tool"][data-s="${sid}"]`)?.focus(),0);
}

});

/* Change le nombre de portions et recalcule toutes les quantités proportionnellement */
function rescale(r, n){
  if(!(n>0) || n===r.portions) return;
  const k = n / r.portions;
  r.lines.forEach(l=>{
    l.qty = Math.round(l.qty*k*10000)/10000;
    const inp = document.querySelector(`[data-f="l-qty"][data-l="${l.id}"]`);
    if(inp) inp.value = inputNum(l.qty);
  });
  r.portions = n; save(); refreshCalc();
  toast("Quantités recalculées pour "+nf(n,n%1?1:0)+" portions");
}

document.addEventListener("change", e=>{
  const f = e.target.dataset.f; if(!f) return;
  const r = rec(ui.recipeId);
  if(f==="plan-recipe"){ const r2=rec(e.target.value), inp=e.target.form.querySelector("[name=portions]"); if(r2&&inp) inp.value=inputNum(r2.portions); return; }
  if(f==="r-portions"){ clearTimeout(rescale.h); rescale(r,num(e.target.value)); return; }
  if(f==="l-ing"){
    const l=r.lines.find(x=>x.id===e.target.dataset.l); l.ingId=e.target.value;
    const i=ing(l.ingId);
    if(i && !unitsFor(i).includes(l.unit)) l.unit=defaultUnit(i);

    const l=r.lines.find(x=>x.id===e.target.dataset.l); const was=l.unit; l.unit=e.target.value;

  } else if(f==="s-tool"){ addTool(r, e.target.dataset.s, e.target.value); }
});

/* Enregistrement d'un ingrédient */
document.addEventListener("submit", e=>{
  if(e.target.id!=="ingForm") return;
  e.preventDefault();
  const fd=new FormData(e.target); const id=e.target.dataset.id;
  const data={
    name:String(fd.get("name")).trim(), price:num(fd.get("price")), priceUnit:fd.get("priceUnit"),
    yield:Math.min(100,Math.max(1,num(fd.get("yield"))||100)), supplier:String(fd.get("supplier")).trim(),
    allergens:fd.getAll("al"),
    pieceG:num(fd.get("pieceG"))||null, density:num(fd.get("density"))||null, from:fd.get("from")||null,
    priceSource:String(fd.get("priceSource")||"").trim(), priceDate:String(fd.get("priceDate")||"")
  };
  { /* Suivi de la source : un prix modifié devient une saisie datée du jour */
    const old = id ? ing(id) : null, today = new Date().toISOString().slice(0,10);
    const catName = e.target.dataset.cat, catPrice = Number(e.target.dataset.catPrice);
    const cat = !old && catName ? catalogFlat().find(c=>c.name===catName) : null;
    if(cat && Math.abs(catPrice-(data.price||0))<1e-9){
      data.priceKind = cat.src ? cat.src.k : "estim"; data.base = true;
      if(cat.src && cat.src.u) data.priceUrl = cat.src.u;
      if(data.priceKind==="estim"){ data.estimate = BASE_DATE; data._keepEstimate = true; }
      if(cat.todo) data.todo = true;
    } else if(!old){
      if(!data.priceSource && data.price>0) data.priceSource = "Saisie manuelle";
      if(!data.priceDate && data.price>0) data.priceDate = today;
      data.priceKind = "manuel";
    } else {
      const priceChanged = Math.abs((old.price||0)-(data.price||0))>1e-9 || old.priceUnit!==data.priceUnit;
      const srcChanged = (old.priceSource||"")!==data.priceSource || (old.priceDate||"")!==data.priceDate;
      if(priceChanged && !srcChanged && data.price>0){
        if(old.priceKind==="estim" || old.priceKind==="releve" || !data.priceSource) data.priceSource = "Saisie manuelle";
        data.priceDate = today;
      }
      data.priceKind = (priceChanged || srcChanged) ? "manuel" : (old.priceKind || "manuel");
      data._keepEstimate = !!(old.estimate && !priceChanged && !srcChanged);
    }
  }
  if(!data.name) return;
  if(data.from && !data.pieceG){ alert("Indiquez le poids d'une pièce pour un ingrédient calculé à partir d'un autre."); return; }
  if(data.from) data.priceUnit="pce";
  let savedId=id;
  if(id){
    const i=ing(id); Object.assign(i,data);

const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const CP1252={"€":128,"‚":130,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"Œ":140,"œ":156,"Š":138,"š":154,"Ž":142,"ž":158,"Ÿ":159};
function pdfByte(ch){
  const c=ch.codePointAt(0);
  if(c===0x202F||c===0xA0||c===0x2009||c===0x2007) return 32;
  if(c>=32&&c<=126) return c;
  if(c>=0xA1&&c<=0xFF) return c;
  if(CP1252[ch]) return CP1252[ch];
  if(ch==="→") return 45; if(ch==="₂") return 50;
  return 63;
}
function pdfStr(s){
  let o="";
  for(const ch of s){
    const b=pdfByte(ch);
    if(b===40||b===41||b===92) o+="\\"+String.fromCharCode(b);
    else if(b<32||b>126) o+="\\"+b.toString(8).padStart(3,"0");
    else o+=String.fromCharCode(b);
  }
  return "("+o+")";
}
function tw(s,size,bold){
  let w=0; for(const ch of s){ const b=pdfByte(ch); w+=(b>=32&&b<=126?HW[b-32]:556); }
  return w/1000*size*(bold?1.07:1);
}
function wrapText(s,maxW,size,bold){
  const out=[];
  String(s||"").split(/\r?\n/).forEach(par=>{
    if(!par.trim()){ out.push(""); return; }
    let line="";
    par.split(/\s+/).filter(Boolean).forEach(w=>{
      const t=line?line+" "+w:w;
      if(!line||tw(t,size,bold)<=maxW) line=t; else { out.push(line); line=w; }
    });
    out.push(line);
  });
  return out;
}
function newPdf(){
  const pages=[], images=[];
  const col=c=>c.map(v=>(v/255).toFixed(3)).join(" ");
  function makePage(p){
    return {
      w:p.w,h:p.h,
      text(x,y,s,size=10,o={}){
        const wd=tw(s,size,o.bold); let X=x;
        if(o.align==="right") X=x-wd; else if(o.align==="center") X=x-wd/2;
        p.ops.push(`BT ${col(o.color||[20,35,45])} rg /${o.bold?"F2":"F1"} ${size} Tf ${X.toFixed(2)} ${(p.h-y).toFixed(2)} Td ${pdfStr(s)} Tj ET`);
      },
      line(x1,y1,x2,y2,o={}){ p.ops.push(`${col(o.color||[203,213,218])} RG ${o.width||0.6} w ${x1} ${p.h-y1} m ${x2} ${p.h-y2} l S`); },
      rect(x,y,w,h,color){ p.ops.push(`${col(color)} rg ${x.toFixed(2)} ${(p.h-y-h).toFixed(2)} ${w.toFixed(2)} ${h} re f`); },
      image(img,x,y,w,h){ let k=images.indexOf(img); if(k<0){ images.push(img); k=images.length-1; } p.imgs=p.imgs||new Set(); p.imgs.add(k);
        p.ops.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(p.h-y-h).toFixed(2)} cm /Im${k} Do Q`); }
    };
  }
  return {
    add(w=595,h=842){ const p={w,h,ops:[]}; pages.push(p); return makePage(p); },
    build(footerFn){
      const n=pages.length, objs=[], off=[]; let out="%PDF-1.4\n";
      objs[1]="<< /Type /Catalog /Pages 2 0 R >>";
      objs[2]=`<< /Type /Pages /Kids [${pages.map((_,i)=>`${5+2*i} 0 R`).join(" ")}] /Count ${n} >>`;
      objs[3]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>";
      objs[4]="<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
      pages.forEach((p,i)=>{
        if(footerFn) footerFn(makePage(p),i+1,n);
        const stream=p.ops.join("\n");
        const xo = p.imgs && p.imgs.size ? ` /XObject << ${[...p.imgs].map(k=>`/Im${k} ${5+2*n+k} 0 R`).join(" ")} >>` : "";
        objs[5+2*i]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.w} ${p.h}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo} >> /Contents ${6+2*i} 0 R >>`;
        objs[6+2*i]=`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
      });
      images.forEach((im,k)=>{ objs[5+2*n+k]=`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.data.length} >>\nstream\n${im.data}\nendstream`; });
      for(let i=1;i<objs.length;i++){ off[i]=out.length; out+=`${i} 0 obj\n${objs[i]}\nendobj\n`; }
      const x=out.length;
      out+=`xref\n0 ${objs.length}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
      out+=`trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
      return out;
    }
  };
}
const pdfFooter=(pg,i,n)=>{
  pg.text(45,pg.h-28,"Mets · "+new Date().toLocaleDateString("fr-FR"),8,{color:[91,107,117]});
  pg.text(pg.w-45,pg.h-28,`Page ${i}/${n}`,8,{color:[91,107,117],align:"right"});

function downloadPDF(str,name){
  const u8=new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) u8[i]=str.charCodeAt(i)&255;
  const u=URL.createObjectURL(new Blob([u8],{type:"application/pdf"}));
  const a=document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}

async function backupNow(){

  save.clean=true; save(); save.clean=false;

}

  try{
    if((await h.requestPermission({mode:"readwrite"}))!=="granted"){ toast("Autorisation refusée"); return; }
    let d=null; try{ d=JSON.parse(await (await h.getFile()).text()); }catch(e){}
    usb.status="ok";
    if(d&&Array.isArray(d.recipes)&&(d.savedAt||0)>(state.savedAt||0)&&confirm("Le fichier de la clé est plus récent que les données de cet appareil. Le charger ?")){
      applyData(d); render(); toast("Données chargées depuis la clé"); return;
    }
    await usbWrite(); if(ui.view==="settings") render(); toast("Clé USB reconnectée");
  }catch(e){ usb.status="error"; updateUsbBadge(); toast("Clé USB introuvable. Vérifiez qu'elle est branchée."); }
}
async function usbForget(){
  usb.handle=null; usb.status="none"; usb.name=""; await idb.del("usb"); updateUsbBadge(); render(); toast("Liaison arrêtée");
}
function usbCard(){

  return `<div class="card"><h3>Fichier sur clé USB</h3>

async function initUsb(){
  if(!FS_OK) return;
  const h=await idb.get("usb"); if(!h) return;
  usb.handle=h; usb.name=h.name; usb.status="needs";
  try{ if((await h.queryPermission({mode:"readwrite"}))==="granted") await usbReconnect(); }catch(e){}

}

/* ========= Plan de la semaine ========= */
function isoDate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const capFirst = s => s.charAt(0).toUpperCase()+s.slice(1);
function weekDays(){ if(!ui.week) ui.week=mondayOf(new Date()); return Array.from({length:7},(_,i)=>addDays(ui.week,i)); }
function weekLabel(){
  const d=weekDays(), f=(x,o)=>x.toLocaleDateString("fr-FR",o);
  return `${f(d[0],{day:"numeric",month:"long"})} au ${f(d[6],{day:"numeric",month:"long",year:"numeric"})}`;
}

function viewPlan(){
  state.plan=state.plan||{};

  let weekCost=0;
  const cards=days.map(d=>{
    const key=isoDate(d), list=state.plan[key]||[];
    let dayCost=0;
    const slotHTML=slot=>{
      const rows=list.filter(e=>e.slot===slot).map(e=>{

        const del=`<button class="iconbtn" data-a="plan-del" data-d="${key}" data-e="${e.id}" aria-label="Retirer ce plat">✕</button>`;

    weekCost+=dayCost; return html;
  }).join("");

function pdfPlanPages(pdf){
  const M=45,H=842,R=595-M,GRAY=[91,107,117];
  let pg=pdf.add(), y=60;
  const np=()=>{ pg=pdf.add(); y=60; };
  pg.text(M,y,"Plan de la semaine",20,{bold:true,color:[27,79,114]}); y+=20;
  pg.text(M,y,weekLabel(),10,{color:GRAY}); y+=12;
  pg.line(M,y,R,y,{color:[20,35,45],width:1.2}); y+=24;
  weekDays().forEach(d=>{
    const list=(state.plan||{})[isoDate(d)]||[];
    if(y+70>H-60) np();
    pg.text(M,y,capFirst(d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})),12,{bold:true,color:[27,79,114]}); y+=6;
    pg.line(M,y,R,y); y+=16;
    const has=list.some(e=>rec(e.recipeId));
    if(!has){ pg.text(M+8,y,"Aucun plat prévu",10,{color:GRAY}); y+=22; return; }
    ["midi","soir"].forEach(slot=>{
      const items=list.filter(e=>e.slot===slot&&rec(e.recipeId)); if(!items.length) return;
      if(y+40>H-60) np();
      pg.text(M+8,y,slot==="midi"?"Midi":"Soir",9,{bold:true,color:GRAY}); y+=15;
      items.forEach(e=>{
        const r=rec(e.recipeId);
        if(y+34>H-60) np();
        pg.text(M+22,y,r.name||"Sans nom",11,{bold:true});
        pg.text(R,y,`${nf(e.portions,e.portions%1?1:0)} portions`,10,{align:"right",color:GRAY}); y+=13;
        const al=recipeAllergens(r);
        if(al.length||hasTodo(r)) wrapText("Allergènes : "+(al.length?al.map(a=>a.s).join(", "):"aucun connu")+(hasTodo(r)?" (à confirmer)":""),R-M-24,8.5).forEach(l=>{ if(y+12>H-60) np(); pg.text(M+22,y,l,8.5,{color:[179,55,43]}); y+=11.5; });
        y+=5;
      });
    });
    y+=10;
  });
}

document.addEventListener("click", e=>{
  const el=e.target.closest("[data-a]"); if(!el) return;
  const a=el.dataset.a;
  if(a==="open-from-plan"){ ui.from="plan"; ui.view="recipe"; ui.recipeId=el.dataset.id; render(); }
  else if(a==="plan-prev"){ ui.week=addDays(weekDays()[0],-7); viewPlan(); }
  else if(a==="plan-next"){ ui.week=addDays(weekDays()[0],7); viewPlan(); }
  else if(a==="plan-today"){ ui.week=mondayOf(new Date()); viewPlan(); }
  else if(a==="plan-add") openPlanDlg(el.dataset.d,el.dataset.s);
  else if(a==="close-plan") $("#planDlg").close();
  else if(a==="plan-del"){
    const k=el.dataset.d; state.plan[k]=(state.plan[k]||[]).filter(x=>x.id!==el.dataset.e);
    if(!state.plan[k].length) delete state.plan[k];
    save(); viewPlan();
  }
  else if(a==="plan-copy"){
    state.plan=state.plan||{}; let n=0;
    weekDays().forEach(d=>{
      const k=isoDate(d), prev=state.plan[isoDate(addDays(d,-7))]||[];
      if(!(state.plan[k]||[]).length && prev.length){ state.plan[k]=prev.filter(x=>rec(x.recipeId)).map(x=>({...x,id:uid()})); n+=state.plan[k].length; }
    });
    save(); viewPlan(); toast(n?`${n} plat${n>1?"s":""} copié${n>1?"s":""}`:"Rien à copier : la semaine précédente est vide ou ces jours sont déjà remplis");
  }
  else if(a==="pdf-plan"){
    const p=newPdf(); pdfPlanPages(p); downloadPDF(p.build(pdfFooter),"plan-semaine-"+isoDate(weekDays()[0])+".pdf"); toast("PDF créé");
  }
});

document.addEventListener("submit", e=>{

const mdb={
  _p:null,
  open(){ return this._p||(this._p=new Promise((res,rej)=>{ try{ const q=indexedDB.open("cuisine_media",1); q.onupgradeneeded=()=>q.result.createObjectStore("m"); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }catch(e){ rej(e); } })); },
  async put(k,v){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction("m","readwrite"); t.objectStore("m").put(v,k); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error("abort")); }); },
  async get(k){ const db=await this.open(); return new Promise((res,rej)=>{ const q=db.transaction("m").objectStore("m").get(k); q.onsuccess=()=>res(q.result||null); q.onerror=()=>rej(q.error); }); },
  async del(k){ try{ const db=await this.open(); await new Promise(res=>{ const t=db.transaction("m","readwrite"); t.objectStore("m").delete(k); t.oncomplete=res; t.onerror=res; t.onabort=res; }); }catch(e){} }
};
let liveUrls=[], viewerUrl=null;
function freeUrls(){ liveUrls.forEach(u=>URL.revokeObjectURL(u)); liveUrls=[]; }
async function hydrate(root){
  for(const im of [...root.querySelectorAll("img[data-mid]")]){
    const box=im.closest(".mtile,.thumb");
    try{ const b=await mdb.get(im.dataset.mid); if(b){ const u=URL.createObjectURL(b); liveUrls.push(u); im.src=u; box&&box.classList.add("loaded"); } else box&&box.classList.add("missing"); }
    catch(e){ box&&box.classList.add("missing"); }
  }
}
function shrinkImage(file,max=1600){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)), w=Math.round(im.naturalWidth*k), h=Math.round(im.naturalHeight*k);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(im,0,0,w,h);
      c.toBlob(b=>{ URL.revokeObjectURL(url); b?res(b):rej(new Error("toBlob")); },"image/jpeg",0.82);
    };
    im.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("image")); };
    im.src=url;
  });
}
function videoPoster(file){
  return new Promise(res=>{
    const url=URL.createObjectURL(file), v=document.createElement("video");
    v.muted=true; v.playsInline=true; v.preload="auto"; v.src=url;
    let done=false; const fin=b=>{ if(done) return; done=true; clearTimeout(t); URL.revokeObjectURL(url); res(b); };
    const t=setTimeout(()=>fin(null),6000);
    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(0.5,(v.duration||1)/2); }catch(e){ fin(null); } };
    v.onseeked=()=>{ try{
      const k=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight,1)), c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(v.videoWidth*k)); c.height=Math.max(1,Math.round(v.videoHeight*k));
      c.getContext("2d").drawImage(v,0,0,c.width,c.height); c.toBlob(b=>fin(b),"image/jpeg",0.75);
    }catch(e){ fin(null); } };
    v.onerror=()=>fin(null);
  });
}
async function addMedia(x,files){
  const arr=[...files]; let ok=0, tooBig=0, bad=0, err="";
  for(let n=0;n<arr.length;n++){
    const f=arr[n]; toast(`Ajout ${n+1} sur ${arr.length}…`);
    try{ const m=await storeMedia(f); if(!m){ bad++; continue; } x.media.push(m); ok++; save(); }
    catch(e){ if(e.tooBig) tooBig++; else { bad++; err=e.message||""; } }
  }
  if(ui.view==="idea"&&ui.ideaId===x.id) renderGallery(x);
  const msg=[];
  if(ok) msg.push(ok+" ajouté"+(ok>1?"s":""));
  if(tooBig) msg.push(tooBig+" vidéo"+(tooBig>1?"s":"")+" trop lourde"+(tooBig>1?"s":"")+" (max 250 Mo)");
  if(bad) msg.push(bad+" impossible"+(bad>1?"s":"")+(err&&isWP()?" ("+err+")":" (espace plein ou format non reconnu)"));
  toast(msg.join(" · ")||"Rien à ajouter");
}
